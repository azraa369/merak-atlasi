name: Publish Merak Atlası

on:
  push:
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: merak-atlasi-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'issue_comment' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site and public guestbook
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            await fs.mkdir('_site', { recursive: true });
            for (const name of ['index.html', 'explore.css', 'explore.js']) {
              await fs.copyFile(name, '_site/' + name);
            }
            let comments = [];
            for await (const page of github.paginate.iterator(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: 1, per_page: 100
            })) {
              comments.push(...page.data.filter(c => c.body && c.body.trim()).map(c => ({
                id: c.id, body: c.body.slice(0,2000),
                user: { login: c.user.login }, created_at: c.created_at
              })));
              comments = comments.slice(-24);
            }
            await fs.writeFile('_site/guestbook.json', JSON.stringify({
              comments, updatedAt: new Date().toISOString()
            }));
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
